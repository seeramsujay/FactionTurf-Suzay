<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F19" />
      <stop offset="50%" stop-color="#131B2E" />
      <stop offset="100%" stop-color="#070A12" />
    </linearGradient>

    <!-- 4 Faction Gradients -->
    <linearGradient id="p1-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EF4444" />
      <stop offset="100%" stop-color="#991B1B" />
    </linearGradient>
    <linearGradient id="p2-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#1E40AF" />
    </linearGradient>
    <linearGradient id="p3-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#065F46" />
    </linearGradient>
    <linearGradient id="p4-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#B45309" />
    </linearGradient>

    <filter id="turf-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="800" height="800" rx="160" fill="url(#bg-grad)" />
  <rect width="792" height="792" x="4" y="4" rx="156" fill="none" stroke="#25324D" stroke-width="3" />

  <!-- Tactical Hex Turf Grid (Isometric Board Outline) -->
  <polygon points="400,160 590,270 590,490 400,600 210,490 210,270" 
           fill="#0F172A" stroke="#334155" stroke-width="4" stroke-linejoin="round" />

  <!-- 4 Faction Quadrants -->
  <!-- Top-Left Quadrant (P1: Crimson Legion) -->
  <polygon points="400,380 210,270 400,160" fill="url(#p1-grad)" opacity="0.85" />
  <!-- Top-Right Quadrant (P2: Azure Syndicate) -->
  <polygon points="400,380 400,160 590,270" fill="url(#p2-grad)" opacity="0.85" />
  <!-- Bottom-Right Quadrant (P3: Emerald Vanguard) -->
  <polygon points="400,380 590,270 400,600" fill="url(#p3-grad)" opacity="0.85" />
  <!-- Bottom-Left Quadrant (P4: Amber Order) -->
  <polygon points="400,380 400,600 210,490 210,270" fill="url(#p4-grad)" opacity="0.85" />

  <!-- Grid Boundaries and Dividers -->
  <line x1="400" y1="160" x2="400" y2="600" stroke="#F8FAFC" stroke-width="3" opacity="0.6" />
  <line x1="210" y1="270" x2="590" y2="490" stroke="#F8FAFC" stroke-width="2" opacity="0.4" />
  <line x1="210" y1="490" x2="590" y2="270" stroke="#F8FAFC" stroke-width="2" opacity="0.4" />

  <!-- Central GitHub Git-Branch PR Battle Node -->
  <circle cx="400" cy="380" r="54" fill="#0B0F19" stroke="#F8FAFC" stroke-width="4" filter="url(#turf-glow)" />
  
  <!-- Git PR Branch Fork Glyphs -->
  <g stroke="#38BDF8" stroke-width="4" fill="none" stroke-linecap="round">
    <path d="M 380,410 L 380,350" />
    <circle cx="380" cy="410" r="6" fill="#38BDF8" />
    <circle cx="380" cy="350" r="6" fill="#38BDF8" />
    <path d="M 380,390 C 395,390 415,380 415,360" />
    <circle cx="415" cy="360" r="6" fill="#F59E0B" />
  </g>

  <!-- Mini Territory Capture Flags -->
  <circle cx="320" cy="270" r="14" fill="#EF4444" stroke="#FFFFFF" stroke-width="2" />
  <text x="320" y="275" font-family="sans-serif" font-weight="900" font-size="12" fill="#FFFFFF" text-anchor="middle">1</text>

  <circle cx="480" cy="270" r="14" fill="#3B82F6" stroke="#FFFFFF" stroke-width="2" />
  <text x="480" y="275" font-family="sans-serif" font-weight="900" font-size="12" fill="#FFFFFF" text-anchor="middle">2</text>

  <circle cx="480" cy="480" r="14" fill="#10B981" stroke="#FFFFFF" stroke-width="2" />
  <text x="480" y="485" font-family="sans-serif" font-weight="900" font-size="12" fill="#FFFFFF" text-anchor="middle">3</text>

  <circle cx="320" cy="480" r="14" fill="#F59E0B" stroke="#FFFFFF" stroke-width="2" />
  <text x="320" y="485" font-family="sans-serif" font-weight="900" font-size="12" fill="#FFFFFF" text-anchor="middle">4</text>

  <!-- Typography Brand Mark -->
  <text x="400" y="694" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="46" fill="#F8FAFC" text-anchor="middle" letter-spacing="8">FACTIONTURF</text>
  <text x="400" y="730" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="16" fill="#38BDF8" text-anchor="middle" letter-spacing="4">GITHUB PR-CONTROLLED MULTIPLAYER TURF WAR</text>
</svg>
